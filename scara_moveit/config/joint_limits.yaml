# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.  # Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# ── SIMULATION vs REAL HARDWARE ──────────────────────────────────────────────
# Gazebo will happily move a joint as fast as you ask.  The real arm is limited
# by how many steps an Arduino Uno can emit, so all four joints carry two values
# and you uncomment the one you are running.  Exactly one must be active.
#
# The real values are derived, not guessed.  With a jumper on M1 only (1/4 step)
# each motor turns in 800 microsteps, so:
#
#   joint     gearing        steps per unit   firmware cap   -> max joint speed
#   column    19:1           2419 steps/rad   1000 steps/s      0.41 rad/s
#   shoulder  8 mm lead    100000 steps/m     1200 steps/s      0.012 m/s
#   forearm   16:1           2037 steps/rad    800 steps/s      0.39 rad/s
#   wrist     4.5:1            573 steps/rad    500 steps/s      0.87 rad/s
#
# The firmware caps (MAX_SPEED[] in scara_moveit_control.ino) sum to 3500
# steps/s, near the ~4000 steps/s an Uno can sustain across all four axes.
# Exceeding a real value does not break anything -- the firmware still clamps
# the motion -- but MoveIt then reports a move finished while the arm is still
# travelling.  Change a gear ratio or a microstepping jumper and these must be
# recomputed alongside the sketch.
#
# NOTE: default_velocity_scaling_factor above multiplies all of these, so at 0.1
# the real values are 10x slower again.  Raise the Velocity Scaling slider in the
# RViz MotionPlanning panel rather than inflating the limits here.
#
# ── 2026-08-19: all four joints set to 0.4 / 0.2 by request ──────────────────
# The derived hardware numbers above are kept as comments, not deleted, because
# they are what the gearing and the firmware actually allow.  0.4 is close to
# the real cap for the column (0.41) and the forearm (0.39), and slower than the
# wrist's (0.87), so those three are fine.
#
# The SHOULDER is the one to know about: 0.4 m/s is 0.012 m/s of real travel
# asked to go 33x faster, i.e. 40000 steps/s against an Uno that sustains about
# 4000 across all four axes.  Nothing breaks -- the firmware clamps it -- but
# MoveIt now plans a 132 mm drop as a third of a second when the slide really
# needs eleven, so it reports the move finished almost immediately.  That is why
# hardware_pick_executor.py waits out the shoulder's REAL travel time itself
# (SHOULDER_SPEED / shoulder_catchup) before it works the gripper.  If the arm
# starts stopping short again, that is the first place to look.
# ─────────────────────────────────────────────────────────────────────────────

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
joint_limits:
  column_joint:
    has_velocity_limits: true
    # max_velocity: 1.5      # simulation
    # max_velocity: 0.41     # real hardware  (19:1, 1000 steps/s cap)
    max_velocity: 0.4
    has_acceleration_limits: true
    max_acceleration: 0.2
  forearm_joint:
    has_velocity_limits: true
    # max_velocity: 1.5      # simulation
    # max_velocity: 0.39     # real hardware  (16:1, 800 steps/s cap)
    max_velocity: 0.4
    has_acceleration_limits: true
    max_acceleration: 0.2
  left_finger_joint:
    # Servo, not a stepper: it moves at its own fixed rate and the firmware just
    # waits GRIPPER_SETTLE_MS. This number only shapes MoveIt's timing.
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: false
    max_acceleration: 0
  right_finger_joint:
    # Mimic of left_finger_joint -- no motor of its own.
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: false
    max_acceleration: 0
  shoulder_joint:
    has_velocity_limits: true
    # max_velocity: 0.5      # simulation
    # max_velocity: 0.012    # real hardware  (8 mm lead, 1200 steps/s cap)
    max_velocity: 0.4
    has_acceleration_limits: true
    max_acceleration: 0.2
  wrist_joint:
    has_velocity_limits: true
    # max_velocity: 1.5      # simulation
    # max_velocity: 0.87     # real hardware  (4.5:1, 500 steps/s cap)
    max_velocity: 0.4
    has_acceleration_limits: true
    max_acceleration: 0.2
